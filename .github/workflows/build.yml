name: Build LumaDim

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\LumaDim\LumaDim.csproj

      - name: Publish self-contained Windows x64 EXE
        run: >-
          dotnet publish .\LumaDim\LumaDim.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableMsixTooling=true
          -p:WindowsPackageType=None
          -o .\publish

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: LumaDim-windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
